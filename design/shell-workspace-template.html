<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    * { box-sizing: border-box; }
    a { color: #006194; } a:hover { color: #007bb9; }
  </style>
</helmet>
<div style="width:1440px;min-height:960px;background:#f8f9ff;font-family:Inter,system-ui,sans-serif;color:#0b1c30;display:flex;flex-direction:column;font-size:14px;line-height:20px;">

  <!-- TOP BAR -->
  <div style="height:56px;background:#ffffff;border-bottom:1px solid #dbe3ee;display:flex;align-items:center;padding:0 20px;gap:16px;flex-shrink:0;">
    <div style="display:flex;align-items:center;gap:10px;width:212px;">
      <div style="width:28px;height:28px;border-radius:8px;background:#006194;display:flex;align-items:center;justify-content:center;">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="3.5" r="1.8"></circle><circle cx="3.5" cy="12" r="1.8"></circle><circle cx="12.5" cy="12" r="1.8"></circle><path d="M7 5.2 4.4 10.3M9 5.2l2.6 5.1M5.3 12h5.4"></path></svg>
      </div>
      <div style="display:flex;flex-direction:column;line-height:14px;">
        <span style="font-weight:700;font-size:14px;letter-spacing:-0.01em;">Fleet Control</span>
        <span style="font-size:11px;color:#3f4850;">for Hermes Agent</span>
      </div>
    </div>
    <div style="flex:1;display:flex;justify-content:center;">
      <div style="width:360px;height:32px;border:1px solid #bfc7d2;border-radius:8px;background:#f8f9ff;display:flex;align-items:center;gap:8px;padding:0 10px;color:#707881;font-size:13px;">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#707881" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5 14 14"></path></svg>
        <span style="flex:1;">Search decisions, outputs…</span>
        <span style="font-family:'JetBrains Mono',monospace;font-size:11px;border:1px solid #bfc7d2;border-radius:4px;padding:0 5px;">⌘K</span>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:14px;">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#3f4850" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11V7a4 4 0 0 1 8 0v4l1 1.5H3z"></path><path d="M6.5 14a1.5 1.5 0 0 0 3 0"></path></svg>
      <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#3f4850" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.5"></circle><path d="M6.2 6.2a1.8 1.8 0 1 1 2.6 1.6c-.6.3-.8.7-.8 1.2"></path><circle cx="8" cy="11.4" r=".4"></circle></svg>
      <div style="display:flex;align-items:center;gap:8px;">
        <div style="width:28px;height:28px;border-radius:999px;background:#e1e0ff;color:#4648d4;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;">MO</div>
        <span style="font-size:13px;font-weight:500;">Marcus Okafor</span>
        <span style="display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;background:#dce9ff;color:#3f4850;font-size:11px;font-weight:600;">Compliance officer</span>
      </div>
    </div>
  </div>

  <div style="display:flex;flex:1;">
    <!-- SIDEBAR -->
    <div style="width:232px;background:#eff4ff;border-right:1px solid #dbe3ee;padding:16px 12px;display:flex;flex-direction:column;gap:20px;flex-shrink:0;">

      <div style="display:flex;flex-direction:column;gap:2px;">
        <div data-nav="home" style="height:34px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:8px;font-size:13px;color:#0b1c30;font-weight:500;"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7.5 8 3l5.5 4.5"></path><path d="M4 6.8V13h8V6.8"></path><path d="M6.5 13V9.5h3V13"></path></svg>Home</div>
        <div data-nav="decisions" style="height:34px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:8px;font-size:13px;color:#0b1c30;font-weight:500;"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.5 13 3.5v4c0 3-2.2 5.3-5 6.5-2.8-1.2-5-3.5-5-6.5v-4z"></path><path d="M5.8 8l1.6 1.6L10.5 6.5"></path></svg>My decisions<span style="margin-left:auto;display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#e1e0ff;color:#4648d4;font-size:11px;font-weight:700;">3</span></div>
        <div data-nav="rooms" style="height:34px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:8px;font-size:13px;color:#0b1c30;font-weight:500;"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h12v7H6l-3 2.5V11H2z"></path></svg>Decision Rooms</div>
        <div data-nav="outputs" style="height:34px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:8px;font-size:13px;color:#0b1c30;font-weight:500;"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2h6l3 3v9H4z"></path><path d="M10 2v3h3M6.5 8h4M6.5 11h4"></path></svg>Fleet outputs</div>
        <div data-nav="ask" style="height:34px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:8px;font-size:13px;color:#0b1c30;font-weight:500;"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 3.5h11v7h-5l-3 2.5V10.5h-3z"></path><path d="M5.5 7h5"></path></svg>Ask the fleet</div>
      </div>

      <div style="flex:1;"></div>
      <div style="display:flex;flex-direction:column;gap:2px;">
        <div data-nav="settings" style="height:34px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:8px;font-size:13px;color:#0b1c30;font-weight:500;"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="2"></circle><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"></path></svg>Settings</div>
        <div style="padding:10px 10px 0;font-size:11px;color:#3f4850;line-height:16px;">Meridian Bank · Compliance workspace<br>Fleet: AML Investigation</div>
      </div>
    </div>

    <!-- MAIN -->
    <div style="flex:1;padding:28px 32px;display:flex;flex-direction:column;gap:20px;min-width:0;">
      <!-- MAIN CONTENT -->
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
