[project]
name = "fleetcontrol-api"
version = "0.1.0"
description = "Fleet Control API (control plane)"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "fleetcontrol-blueprint"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]
postgres = ["psycopg[binary]>=3.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fleetcontrol_api*"]
