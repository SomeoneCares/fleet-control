<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    * { box-sizing: border-box; }
    a { color: #006194; } a:hover { color: #007bb9; }
  </style>
</helmet>
<div style="width:1440px;height:900px;background:#eff4ff;font-family:Inter,system-ui,sans-serif;color:#0b1c30;font-size:14px;line-height:20px;display:flex;align-items:center;justify-content:center;">
  <div style="width:420px;background:#ffffff;border:1px solid #dbe3ee;border-radius:12px;padding:36px;display:flex;flex-direction:column;gap:24px;">

    <!-- Logo mark -->
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="width:28px;height:28px;border-radius:8px;background:#006194;display:flex;align-items:center;justify-content:center;">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="3.5" r="1.8"></circle><circle cx="3.5" cy="12" r="1.8"></circle><circle cx="12.5" cy="12" r="1.8"></circle><path d="M7 5.2 4.4 10.3M9 5.2l2.6 5.1M5.3 12h5.4"></path></svg>
      </div>
      <div style="display:flex;flex-direction:column;line-height:14px;">
        <span style="font-weight:700;font-size:14px;letter-spacing:-0.01em;">Fleet Control</span>
        <span style="font-size:11px;color:#3f4850;">for Hermes Agent</span>
      </div>
    </div>

    <h1 style="margin:0;font-size:24px;line-height:32px;font-weight:600;letter-spacing:-0.02em;">Sign in</h1>

    <div style="height:36px;border-radius:8px;background:#006194;color:#ffffff;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="10" height="7" rx="1.5"></rect><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"></path></svg>Continue with corporate SSO
    </div>

    <div style="display:flex;align-items:center;gap:12px;">
      <div style="flex:1;height:1px;background:#dbe3ee;"></div>
      <span style="font-size:12px;color:#707881;">or</span>
      <div style="flex:1;height:1px;background:#dbe3ee;"></div>
    </div>

    <div style="display:flex;flex-direction:column;gap:14px;">
      <div style="display:flex;flex-direction:column;gap:6px;">
        <div style="font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#3f4850;">Email</div>
        <div style="height:36px;border:1px solid #bfc7d2;border-radius:8px;background:#ffffff;display:flex;align-items:center;padding:0 12px;font-size:13px;color:#707881;">name@meridianbank.com</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;">
        <div style="font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#3f4850;">Password</div>
        <div style="height:36px;border:1px solid #bfc7d2;border-radius:8px;background:#ffffff;display:flex;align-items:center;padding:0 12px;font-size:13px;color:#707881;letter-spacing:.2em;">••••••••••</div>
      </div>
      <div style="height:36px;border:1px solid #bfc7d2;border-radius:8px;background:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:500;">Sign in</div>
    </div>

    <div style="font-size:12px;color:#3f4850;text-align:center;">Fleet Control for Hermes Agent · Meridian Bank workspace</div>
  </div>
</div>

</x-dc>
</body>
</html>
