[project]
name = "fleetcontrol-hermes-plugin"
version = "0.1.0"
description = "Fleet Control plugin for Hermes Agent (evidence + policy hooks). Installed into ~/.hermes/plugins/fleetcontrol by the fleetctl-agent installer."
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fleetcontrol*"]
