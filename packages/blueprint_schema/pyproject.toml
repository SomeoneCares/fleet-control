[project]
name = "fleetcontrol-blueprint"
version = "0.1.0"
description = "Fleet Blueprint schema v1 for Fleet Studio (for Hermes Agent)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "PyYAML>=6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fleetcontrol_blueprint*"]

[tool.setuptools.package-data]
fleetcontrol_blueprint = ["missions/*.yaml", "missions/*/*.yaml"]
