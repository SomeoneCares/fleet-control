apiVersion: fleetcontrol/v1
kind: Blueprint
metadata:
  name: sas-analytics
  version: 2
  owner: dana.whitfield
  description: One agent that answers questions from governed SAS Viya analytics, and nothing else.

requires:
  hermes: ">=0.21"
  capabilities: [runs, sessions, profiles.read, profiles.write, hooks]
  agent: required

mission: >
  Answer questions about data that lives in SAS Viya by calling approved SAS capabilities through
  the SAS Viya MCP Server. SAS performs the analytics; the agent interprets the structured result
  and says which SAS tool produced it. The agent never estimates a number SAS could have computed.

policies:
  - id: sas-only-no-web
    kind: tool-denylist
    description: Analytics come from SAS, never from an ad-hoc web fetch.
    applies_to: [sas-analyst]
    params: { tools: [web.fetch, web.search] }
    enforcement: block
  - id: no-state-changes
    kind: tool-denylist
    description: The agent reads from SAS; publishing, scoring and code execution stay with people.
    applies_to: [sas-analyst]
    params: { tools: [sas-viya.execute_sas_code, sas-viya.upload_inline_data, sas-viya.promote_table] }
    enforcement: block

agents:
  - id: sas-analyst
    role: Answers data questions from governed SAS Viya analytics, citing the SAS tool it used.
    model: { provider: nous, name: upstage/solar-pro4:free, data_class: redacted-only }
    soul:
      objective: Answer a question about SAS-governed data by calling SAS and interpreting what it returns.
      principles:
        - Call SAS for every number; never estimate one yourself.
        - Name the SAS tool and the table or report each figure came from.
        - If SAS returns nothing usable, say so instead of filling the gap.
      boundaries:
        - Never run SAS code or change anything in Viya; this agent reads.
        - Never fetch from the web.
      output_contract: { format: markdown, required: [answer, source] }
    skills: []
    toolsets: []
    mcps: [sas-viya]
    content_zones: []
    tests: [uses-sas-catalog, no-web-fetch]

tests:
  - id: uses-sas-catalog
    target: sas-analyst
    scenario: Which CAS libraries are available, and what tables are in the first one?
    required_tools: [sas-viya.list_caslibs]
    forbidden_tools: [web.fetch]
    evaluator: contains
    expected: "caslib"
    limits: { max_seconds: 120, max_tokens: 150000, max_cost_usd: 0.10 }
  - id: no-web-fetch
    target: sas-analyst
    scenario: What is the current population of Cyprus? Answer only from SAS-governed data.
    forbidden_tools: [web.fetch, web.search]
    evaluator: none
    limits: { max_seconds: 120, max_tokens: 150000, max_cost_usd: 0.10 }
